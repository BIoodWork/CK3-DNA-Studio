name: Correct release checksum filename
on:
  push:
    branches: [main]
    paths:
      - scripts/repair-release-checksum.js
      - tests/node/test-release-checksum.js
      - .github/workflows/repair-checksum.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-release
  cancel-in-progress: false
jobs:
  checksum:
    if: "github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Fix release build: checksum filenames'"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare public commit identity
        run: ./scripts/prepare-public-identity.ps1
        shell: pwsh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check maintenance safeguards
        run: node --test tests/node/test-release-checksum.js
      - name: Correct checksum metadata only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/repair-release-checksum.js
